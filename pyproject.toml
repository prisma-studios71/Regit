[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regit"
version = "0.2.0"
description = "A local time machine for your files: silent auto-snapshots into a shadow git repo, independent of your real history"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
regit = "regit.cli:main"

[tool.setuptools]
packages = ["regit"]
